name: build and check

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX Live and poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended \
            texlive-fonts-extra texlive-science texlive-plain-generic latexmk poppler-utils

      - name: Build
        run: latexmk -pdf -interaction=nonstopmode main.tex

      - name: Check the built PDF against the TRB rules
        run: python3 check_trb_compliance.py main.pdf

      - name: Self-tests (class options, checker still rejects bad builds)
        run: python3 selftest.py

      - uses: actions/upload-artifact@v4
        with:
          name: main-pdf
          path: main.pdf
